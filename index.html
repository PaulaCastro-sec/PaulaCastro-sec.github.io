<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paula Castro · Cloud Security en Azure</title>
<meta name="description" content="Portafolio de Paula Castro: seguridad en la nube con Microsoft Azure, soporte TI e Ingeniería de Sistemas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<script>
/* ============================================================
   ✏️  EDITA AQUÍ  ✏️
   Todo tu contenido vive en este bloque. Cambia solo lo que
   está entre comillas "así". No borres comas ni corchetes.
   ============================================================ */
const DATOS = {
  nombre: "Paula Alejandra Castro Castro",
  titular: "Ingeniería de Sistemas · Seguridad en la nube con Microsoft Azure",
  ciudad: "Bogotá, Colombia",
  // Sube tu foto al repositorio (ej: foto.jpg) y escribe aquí su nombre. Vacío = salen tus iniciales.
  foto: "foto.jfif",

  frase: "De cuidar pacientes a proteger la nube.",
  sobreMi: "Trabajé en salud, donde aprendí a seguir protocolos bajo presión y a manejar datos sensibles con cuidado. Desde 2023 doy soporte TI como independiente, y hoy me estoy especializando en seguridad en la nube con Microsoft Azure mientras termino Ingeniería de Sistemas.",

  // Tus links. Si aún no tienes uno, déjalo vacío "" y el botón no aparece.
  correo: "paacastroc@outlook.es",
  linkedin: "https://www.linkedin.com/in/paula-alejandra-castro-castro/",
  github: "https://github.com/PaulaCastro-sec",

  // Tu historia: en orden, de la más antigua a la más nueva.
  trayectoria: [
    { anio: "2019–2021", titulo: "Auxiliar de enfermería", texto: "Varias IPS. Protocolos, trabajo bajo presión y manejo de datos sensibles." },
    { anio: "2023–hoy", titulo: "Soporte TI independiente", texto: "Mantenimiento de computadores, solución de problemas y páginas web para clientes." },
    { anio: "2027", titulo: "Ingeniera de Sistemas", texto: "Énfasis en ciberseguridad. Fundación Universitaria del Área Andina." }
  ],

  // estado: "listo" (verde) o "en camino" (mango)
  proyectos: [
    { nombre: "Este portafolio", estado: "listo", que: "Mi sitio personal, hecho en HTML y CSS y publicado gratis con GitHub Pages.", tecnologias: "HTML · CSS · GitHub Pages", link: "" },
    { nombre: "Cloud Resume Challenge en Azure", estado: "en camino", que: "Mi hoja de vida como sitio web en Azure, con contador de visitas e infraestructura en Terraform.", tecnologias: "Azure · Terraform · GitHub Actions", link: "" },
    { nombre: "Landing zone segura con Terraform", estado: "en camino", que: "Red, reglas de acceso y bóveda de secretos en Azure creadas con código y revisadas con buenas prácticas.", tecnologias: "Terraform · Azure Policy · Key Vault", link: "" }
  ],

  // estado: "listo" o "en camino". En 'cuando' pon la fecha meta o la fecha en que la obtuviste.
  certificaciones: [
    { nombre: "Microsoft Azure Fundamentals (AZ-900)", estado: "en camino", cuando: "Meta: diciembre 2026", link: "" },
    { nombre: "Security, Compliance & Identity Fundamentals (SC-900)", estado: "en camino", cuando: "Meta: enero 2027", link: "" },
    { nombre: "HashiCorp Terraform Associate", estado: "en camino", cuando: "Meta: abril 2027", link: "" },
    { nombre: "Cloud and AI Security Engineer Associate (SC-500)", estado: "en camino", cuando: "Meta: julio 2027", link: "" },
    { nombre: "Técnico en Enfermería · SENA", estado: "listo", cuando: "2020", link: "" }
  ],

  habilidades: ["Microsoft Azure", "Seguridad en la nube", "Soporte TI", "Python", "PowerShell", "Git y GitHub", "Terraform", "HTML y CSS"],
  idiomas: "Español nativo · Inglés B1, en camino a C1"
};
/* ================== FIN DE LO EDITABLE ================== */
</script>

<style>
  :root{
    --malva:#7E5BAE; --lila:#F7F2FC; --lila2:#ECE2F8; --menta:#B8E4C8; --menta2:#E3F5EA;
    --mango:#FFD98C; --mango2:#FFF3D6; --tinta:#3D2E5C; --suave:#6E6188; --blanco:#FFFFFF;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} }
  body{margin:0;background:var(--lila);color:var(--tinta);font-family:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.6}
  a{color:var(--malva);text-underline-offset:3px}
  a:focus-visible,button:focus-visible{outline:3px solid var(--malva);outline-offset:3px;border-radius:6px}
  .wrap{max-width:780px;margin:0 auto;padding:0 22px}

  /* Hero */
  header{padding:64px 0 40px}
  .who{display:flex;align-items:center;gap:18px;margin-bottom:34px}
  .avatar{width:76px;height:76px;border-radius:50%;flex:none;background:var(--malva);color:var(--blanco);
    display:grid;place-items:center;font-weight:900;font-size:26px;overflow:hidden;border:4px solid var(--blanco)}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .who h1{margin:0;font-size:22px;font-weight:800;line-height:1.2}
  .who p{margin:2px 0 0;color:var(--suave);font-size:15px}
  .frase{font-size:clamp(38px,8vw,66px);line-height:1.04;font-weight:900;letter-spacing:-0.02em;margin:0 0 22px;color:var(--tinta)}
  .frase span{display:block;color:var(--malva)}
  .intro{max-width:62ch;margin:0 0 28px;font-size:18px}
  .botones{display:flex;flex-wrap:wrap;gap:10px}
  .btn{display:inline-block;padding:11px 20px;border-radius:999px;font-weight:800;text-decoration:none;font-size:15px;border:2px solid var(--malva)}
  .btn.principal{background:var(--malva);color:var(--blanco)}
  .btn.sec{background:transparent;color:var(--malva)}

  section{padding:34px 0}
  h2{font-size:26px;font-weight:900;margin:0 0 18px}

  /* Trayectoria: es una secuencia real, por eso va como línea de tiempo */
  .linea{list-style:none;margin:0;padding:0;position:relative}
  .linea::before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:3px;background:var(--lila2);border-radius:3px}
  .linea li{position:relative;padding:0 0 22px 40px}
  .linea li::before{content:"";position:absolute;left:0;top:5px;width:21px;height:21px;border-radius:50%;background:var(--blanco);border:4px solid var(--menta)}
  .linea li:last-child::before{border-color:var(--malva);background:var(--mango)}
  .anio{font-size:14px;font-weight:800;color:var(--malva)}
  .linea h3{margin:0;font-size:19px;font-weight:800}
  .linea p{margin:2px 0 0;color:var(--suave)}

  /* Proyectos y certificaciones: filas con una barra de color que indica el estado */
  .lista{display:grid;gap:12px}
  .item{background:var(--blanco);border-radius:16px;padding:16px 18px 16px 20px;border-left:7px solid var(--mango)}
  .item.listo{border-left-color:var(--menta)}
  .item .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
  .item h3{margin:0;font-size:18px;font-weight:800}
  .estado{font-size:13px;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--mango2);color:#7A5410;white-space:nowrap}
  .item.listo .estado{background:var(--menta2);color:#2E6B49}
  .item p{margin:6px 0 0}
  .item .tec{font-size:14px;color:var(--suave);margin-top:6px}
  .item a.ver{font-weight:800;font-size:15px;display:inline-block;margin-top:6px}
  .leyenda{font-size:14px;color:var(--suave);margin:-6px 0 16px}

  .chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:0 0 16px}
  .chips li{background:var(--lila2);padding:6px 14px;border-radius:999px;font-weight:700;font-size:15px}

  footer{margin-top:20px;padding:40px 0 56px;background:var(--malva);color:var(--blanco)}
  footer h2{color:var(--blanco)}
  footer p{margin:0 0 18px;max-width:55ch}
  footer .btn.principal{background:var(--mango);border-color:var(--mango);color:var(--tinta)}
  footer .btn.sec{color:var(--blanco);border-color:var(--blanco)}
  .pie{margin-top:28px;font-size:13px;opacity:.8}

  @media (max-width:520px){
    body{font-size:16px} header{padding-top:40px} .who{margin-bottom:26px}
  }
</style>
</head>
<body>
  <header class="wrap">
    <div class="who">
      <div class="avatar" id="avatar" aria-hidden="true"></div>
      <div><h1 id="nombre"></h1><p id="titular"></p></div>
    </div>
    <p class="frase" id="frase"></p>
    <p class="intro" id="sobreMi"></p>
    <div class="botones" id="botonesTop"></div>
  </header>

  <main class="wrap">
    <section aria-labelledby="t-tray">
      <h2 id="t-tray">Mi camino</h2>
      <ol class="linea" id="trayectoria"></ol>
    </section>

    <section aria-labelledby="t-proy">
      <h2 id="t-proy">Proyectos</h2>
      <p class="leyenda">Verde: terminado. Mango: en construcción.</p>
      <div class="lista" id="proyectos"></div>
    </section>

    <section aria-labelledby="t-cert">
      <h2 id="t-cert">Certificaciones</h2>
      <div class="lista" id="certificaciones"></div>
    </section>

    <section aria-labelledby="t-hab">
      <h2 id="t-hab">Habilidades e idiomas</h2>
      <ul class="chips" id="habilidades"></ul>
      <p id="idiomas"></p>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <h2>Hablemos</h2>
      <p>Busco mi primer rol en seguridad en la nube, soporte cloud o SOC. Escríbeme y te respondo pronto.</p>
      <div class="botones" id="botonesPie"></div>
      <p class="pie" id="pie"></p>
    </div>
  </footer>

<script>
  const D = DATOS;
  const $ = id => document.getElementById(id);
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt) e.textContent = txt; return e; };

  document.title = D.nombre + " · " + D.titular.split("·").pop().trim();
  $("nombre").textContent = D.nombre;
  $("titular").textContent = D.titular + " · " + D.ciudad;

  // Foto o iniciales
  if (D.foto) { const img = new Image(); img.src = D.foto; img.alt = ""; $("avatar").appendChild(img); }
  else { $("avatar").textContent = D.nombre.split(" ").map(p => p[0]).slice(0, 2).join(""); }

  // Frase grande: desde la palabra "a" va en malva, en su propia línea
  const partes = D.frase.split(" a ");
  if (partes.length === 2) { $("frase").append(partes[0]); $("frase").appendChild(el("span", "", "a " + partes[1])); }
  else { $("frase").textContent = D.frase; }
  $("sobreMi").textContent = D.sobreMi;

  function botones(dest) {
    const lista = [
      [D.cv, "Ver mi CV", "principal"],
      [D.linkedin, "LinkedIn", "sec"],
      [D.github, "GitHub", "sec"],
      [D.correo ? "mailto:" + D.correo : "", "Escríbeme", "sec"]
    ];
    lista.forEach(([href, txt, tipo]) => {
      if (!href) return;
      const a = el("a", "btn " + tipo, txt); a.href = href;
      if (href.startsWith("http")) { a.target = "_blank"; a.rel = "noopener"; }
      $(dest).appendChild(a);
    });
    // Si no hay CV, el primer botón visible pasa a ser el principal
    const primero = $(dest).querySelector(".btn");
    if (primero && !D.cv) { primero.classList.remove("sec"); primero.classList.add("principal"); }
  }
  botones("botonesTop"); botones("botonesPie");

  D.trayectoria.forEach(t => {
    const li = el("li");
    li.append(el("div", "anio", t.anio), el("h3", "", t.titulo), el("p", "", t.texto));
    $("trayectoria").appendChild(li);
  });

  function fila(x, extra) {
    const listo = (x.estado || "").toLowerCase() === "listo";
    const d = el("article", "item" + (listo ? " listo" : ""));
    const top = el("div", "top");
    top.append(el("h3", "", x.nombre), el("span", "estado", listo ? "Listo" : "En camino"));
    d.appendChild(top);
    extra(d);
    if (x.link) { const a = el("a", "ver", "Ver"); a.href = x.link; a.target = "_blank"; a.rel = "noopener"; d.appendChild(a); }
    return d;
  }
  D.proyectos.forEach(p => $("proyectos").appendChild(fila(p, d => {
    d.appendChild(el("p", "", p.que));
    if (p.tecnologias) d.appendChild(el("div", "tec", p.tecnologias));
  })));
  D.certificaciones.forEach(c => $("certificaciones").appendChild(fila(c, d => {
    if (c.cuando) d.appendChild(el("div", "tec", c.cuando));
  })));

  D.habilidades.forEach(h => $("habilidades").appendChild(el("li", "", h)));
  $("idiomas").textContent = D.idiomas;
  $("pie").textContent = D.nombre + " · " + D.ciudad + " · " + new Date().getFullYear();
</script>
</body>
</html>
